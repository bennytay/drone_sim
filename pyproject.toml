[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drone-deployment-ir"
version = "0.1.0"
description = "Canonical deployment representation for drone readiness verification"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "pypdf>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
deployment-ir-schema = "drone_sim.schema:main"
deployment-evidence-schema = "drone_sim.evidence_schema:main"
deployment-context = "drone_sim.context_cli:main"
drone-eval = "drone_sim.golden_path:main"
drone-llm-smoke = "drone_sim.llm_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "component: one module or contract in isolation (see docs/TESTING.md)",
    "integration: several components wired together (see docs/TESTING.md)",
    "golden: the Golden Path product workflow (see docs/DEMO.md)",
]

[tool.hatch.build.targets.wheel]
packages = ["src/drone_sim"]
