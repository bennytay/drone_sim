[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drone-deployment-ir"
version = "0.1.0"
description = "Canonical deployment representation for drone readiness verification"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
deployment-ir-schema = "drone_sim.schema:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/drone_sim"]
